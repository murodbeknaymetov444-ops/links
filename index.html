<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  box-sizing:border-box;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#050506;--ink:#f4f4f8;--muted:#8b8c98;--glass:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);
  --c1:#e4e4ea;--c2:#6f727e;--c3:#b9aa8e;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}

/* fon: don (grain) + kursorga ergashuvchi yorug'lik */
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(110px)}
.glow i:nth-child(1){width:380px;height:380px;background:var(--c1);opacity:.1;top:-130px;left:-110px;animation:d1 18s ease-in-out infinite alternate}
.glow i:nth-child(2){width:340px;height:340px;background:var(--c3);opacity:.11;bottom:-110px;right:-110px;animation:d2 21s ease-in-out infinite alternate}
.glow b{position:absolute;width:520px;height:520px;left:0;top:0;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);transform:translate(50vw,30vh);transition:transform .35s ease-out}
@keyframes d1{to{transform:translate(70px,90px) scale(1.15)}}
@keyframes d2{to{transform:translate(-80px,-70px) scale(1.2)}}

main{position:relative;z-index:1;width:100%;max-width:440px;padding:28px 20px 48px}
.top{text-align:center;margin-bottom:30px}

/* avatar + aylanuvchi yozuv halqasi */
.orbit{position:relative;width:124px;height:124px;margin:0 auto 22px;animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
.avatar{position:absolute;inset:0;border-radius:50%;padding:3px;
  background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 6s linear infinite}
.avatar::after{content:"";position:absolute;inset:-12px;border-radius:50%;background:inherit;filter:blur(26px);opacity:.2;z-index:-1}
.avatar span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#09090c;background-size:cover;background-position:center;font-size:44px;font-weight:800}
@keyframes spin{to{--a:360deg}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-30deg)}to{opacity:1;transform:none}}

/* katta ism: harflar birma-bir chiqadi */
h1{font-size:clamp(30px,9vw,38px);line-height:1.1;margin:0 0 14px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
h1 span{display:inline-block;opacity:0;transform:translateY(45%);filter:blur(10px);animation:letter .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
.handle{display:inline-block;margin:0;padding:6px 14px;border:1px solid var(--line);border-radius:99px;color:#b5b6c4;font-size:15px;background:var(--glass)}
.rise{opacity:0;transform:translateY(14px);animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}

ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;perspective:900px}
li{opacity:0;transform:translateY(18px);animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
li:nth-child(1){animation-delay:.9s}li:nth-child(2){animation-delay:1.02s}
li:nth-child(3){animation-delay:1.14s}li:nth-child(4){animation-delay:1.26s}

a.link{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;
  background-color:var(--glass);
  background-image:radial-gradient(240px circle at var(--mx,-400px) var(--my,-400px),rgba(255,255,255,.13),transparent 65%);
  border:1px solid var(--line);color:var(--ink);text-decoration:none;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .18s ease-out,border-color .3s;will-change:transform}
a.link:hover{border-color:rgba(255,255,255,.32)}
a.link:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
.ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;
  background:#202026;border:1px solid rgba(255,255,255,.12);transition:transform .3s}
a.link:hover .ic{transform:rotate(-8deg) scale(1.1)}
.ic svg{width:24px;height:24px;fill:currentColor}
.txt{display:flex;flex-direction:column;min-width:0}
.txt b{font-size:17px;font-weight:600}
.txt span{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{margin-left:auto;font-size:22px;opacity:.4;transition:transform .3s,opacity .3s}
a.link:hover .go{transform:translateX(5px);opacity:1}

/* asosiy tugma: aylanuvchi chegara + yaltiroq o'tish */
a.link.main{padding:20px 18px;border:none;isolation:isolate;background-color:#0c0c11;
  background-image:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.11) 50%,transparent 58%),
    radial-gradient(260px circle at var(--mx,-400px) var(--my,-400px),rgba(255,255,255,.13),transparent 65%);
  background-size:250% 100%,100% 100%;background-repeat:no-repeat;background-position:130% 0,0 0;animation:sheen 4.5s ease-in-out infinite 2s}
@keyframes sheen{0%{background-position:130% 0,0 0}55%,100%{background-position:-130% 0,0 0}}
a.link.main::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;
  background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 4s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
a.link.main::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-2;
  background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));filter:blur(20px);opacity:.14;animation:spin 4s linear infinite}
a.link.main .ic{background:#f2f2f6;color:#0c0c11;border:none}
a.link.main .txt b{font-size:18px}

footer{text-align:center;margin-top:34px;color:var(--muted);font-size:14px;animation-delay:1.6s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rise,li,.orbit,h1 span{opacity:1;transform:none;filter:none}
}
</style>

  })();

  function renderName(){
    var h = $("name"), t = state.name || "";
    h.setAttribute("aria-label", t);
    h.textContent = "";
    Array.from(t).forEach(function(ch, i){
      var sp = document.createElement("span");
      sp.setAttribute("aria-hidden","true");
      sp.textContent = ch===" " ? "\u00a0" : ch;
      sp.style.animationDelay = (0.15 + i*0.06) + "s";
      h.appendChild(sp);
    });
    $("footName").textContent = state.name || "";
  }
  function renderAvatar(){
    var sp = $("avatarLetter");
    sp.textContent = ""; sp.style.backgroundImage = "";
    if(state.avatar){ sp.style.backgroundImage = 'url("' + state.avatar.replace(/"/g,"%22") + '")'; }
    else { var ch = (state.name || "?").trim().charAt(0).toUpperCase(); sp.textContent = ch || "?"; }
  }
  function renderLinks(){
    var ul = $("links");
    ul.innerHTML = "";
    state.links.forEach(function(l, i){
      var li = document.createElement("li");
      li.style.animationDelay = (0.9 + i*0.12) + "s";
      var a = document.createElement("a");
      a.className = "link" + (l.main ? " main" : "");
      a.href = l.url || "#";
      a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = '<span class="ic"><svg viewBox="0 0 24 24"><path d="' + (ICONS[l.icon]||ICONS.website) + '"/></svg></span>'
        + '<span class="txt"><b>' + esc(l.title) + '</b><span>' + esc(l.sub) + '</span></span>'
        + '<span class="go" aria-hidden="true">\u203a</span>';
      li.appendChild(a); ul.appendChild(li);
    });
    wireTilt();
  }
  function renderPage(){ renderName(); $("handle").textContent = state.handle || ""; renderAvatar(); renderLinks(); }

  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
  function wireTilt(){
    if(reduced) return;
    document.querySelectorAll("a.link").forEach(function(a){
      a.addEventListener("pointermove", function(e){
        var r = a.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top;
        a.style.setProperty("--mx", x+"px"); a.style.setProperty("--my", y+"px");
        var dx = x/r.width-.5, dy = y/r.height-.5;
        a.style.transform = "perspective(700px) rotateX(" + (-dy*7) + "deg) rotateY(" + (dx*7) + "deg) translateY(-3px)";
      });
      a.addEventListener("pointerleave", function(){
        a.style.transform = ""; a.style.setProperty("--mx","-400px"); a.style.setProperty("--my","-400px");
      });
    });
  }

  renderPage();

  fetch("data.json", {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d){ state = normalize(d); renderPage(); } })
    .catch(function(){});

  if(!reduced){
    var spot = $("spot");
    window.addEventListener("pointermove", function(e){
      spot.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
    });
  }
})();
</script>
</body>
</html>
